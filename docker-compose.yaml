version: '1.0'
services:
  speech-recognition:
    image: ai-server/speech-recognition
    ports:
      - 8080:8080
    volumes:
      - ${SPEECH_RECOGNITION_MODEL}:/models/${WHISPER_MODEL_NAME}
    environment:
      - MODEL_NAME=${WHISPER_MODEL_NAME}
      
  chatbot:
    image: ai-server/chatbot
    ports:
      - 8181:8181
    volumes:
      - ${CHATBOT_MODEL}:/models/${CHATBOT_MODEL_NAME}
    environment:
      - MODEL_NAME=${CHATBOT_MODEL_NAME}

  embeddings:
    image: ai-server/embeddings
    ports:
      - 8282:8282
    volumes:
      - ${EMBEDDINGS_MODEL}:/models/${EMBEDDINGS_MODEL_NAME}
    environment:
      - MODEL_NAME=${EMBEDDINGS_MODEL_NAME}

  text-to-speech:
    image: ai-server/text-to-speech
    ports:
      - 8383:8383
    volumes:
      - ${KOKORO_TTS_MODEL}:/app/assets/${KOKORO_TTS_MODEL_NAME}
    environment:
      - MODEL_NAME=${KOKORO_TTS_MODEL_NAME}